# PR 검사. 바뀐 패키지와 그것에 의존하는 패키지만 typecheck, vitest, build 합니다.
# 비밀값이 필요 없고, 포크 PR에서도 안전하게 돌도록 Secrets를 쓰지 않습니다.
name: ci

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  convention:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          package-manager-cache: false
      - name: PR 제목 규칙
        env:
          # 제목은 사용자 입력이므로 스크립트에 직접 넣지 않고 환경 변수로 넘깁니다
          PR_TITLE: ${{ github.event.pull_request.title }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node packages/conventions/check-pr.mjs

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          package-manager-cache: false
      - name: 저장소 파일 검사
        run: node packages/conventions/check-secrets.mjs --all
      - name: gitleaks로 커밋 기록 전체 검사
        env:
          GITLEAKS_VERSION: 8.28.0
          GITLEAKS_SHA256: a65b5253807a68ac0cafa4414031fd740aeb55f54fb7e55f386acb52e6a840eb
        run: |
          curl -sSfL -o gitleaks.tar.gz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
          ./gitleaks git --redact --no-banner .

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: 검사 대상
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: pnpm exec turbo ls --filter="...[${BASE_SHA}]"
      - name: 타입 검사, vitest, 빌드 (바뀐 곳만)
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: pnpm exec turbo run typecheck test build --filter="...[${BASE_SHA}]"
