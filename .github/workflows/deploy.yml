# main에 머지되면: 바뀐 앱만 vitest → 이미지 빌드 → 서버 배포.
# 필요한 Secrets: DEPLOY_HOST, DEPLOY_SSH_KEY, DEPLOY_KNOWN_HOSTS
# DEPLOY_SSH_KEY는 서버의 deploy.sh만 실행할 수 있는 전용 키입니다 (deploy/README.md).
name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      apps:
        description: "배포할 앱 (공백으로 구분: cv blog employ api)"
        required: true
        default: "cv blog employ api"

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      apps: ${{ steps.apps.outputs.apps }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: 바뀐 앱 고르기
        id: apps
        env:
          BEFORE: ${{ github.event.before }}
          INPUT_APPS: ${{ inputs.apps }}
          EVENT: ${{ github.event_name }}
        run: node scripts/deploy-plan.mjs >> "$GITHUB_OUTPUT"
      - name: vitest (바뀐 곳만)
        if: github.event_name == 'push'
        env:
          BEFORE: ${{ github.event.before }}
        run: pnpm exec turbo run typecheck test --filter="...[${BEFORE}]"

  deploy:
    needs: plan
    if: needs.plan.outputs.apps != '[]'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      # 메모리가 작은 서버라 한 번에 하나씩 교체합니다
      max-parallel: 1
      matrix:
        app: ${{ fromJSON(needs.plan.outputs.apps) }}
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        run: echo "sha=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/${{ matrix.app }}/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ghcr.io/${{ github.repository }}/${{ matrix.app }}:${{ steps.meta.outputs.sha }}
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}
      - name: 서버에 배포
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
          APP: ${{ matrix.app }}
          TAG: ${{ steps.meta.outputs.sha }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          # 토큰은 명령줄에 남지 않게 표준 입력으로 넘깁니다
          printf '%s' "$GHCR_TOKEN" | ssh -i ~/.ssh/deploy_key "ubuntu@$HOST" "deploy $APP $TAG $GHCR_USER"
      - name: 정리
        if: always()
        run: rm -f ~/.ssh/deploy_key
