    <line class="ln-ink" x1="64" y1="146" x2="128" y2="146" marker-end="url(#k)"/>
    <text class="tx-s" x="97" y="138" text-anchor="middle">C에게</text>
    <line class="ln" x1="170" y1="128" x2="170" y2="90" marker-end="url(#a)"/>
    <line class="ln" x1="210" y1="146" x2="274" y2="146" marker-end="url(#a)"/>
    <line class="ln" x1="170" y1="164" x2="170" y2="202" marker-end="url(#a)"/>
    <rect class="bx-soft" x="130" y="128" width="80" height="36" rx="6"/>
