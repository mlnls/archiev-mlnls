    <rect class="bx" x="0" y="130" width="64" height="32" rx="8"/>
    <text x="32" y="151" text-anchor="middle">A</text>
    <rect class="bx" x="138" y="56" width="64" height="32" rx="8"/>
    <text x="170" y="77" text-anchor="middle">B</text>
    <rect class="bx" x="276" y="130" width="64" height="32" rx="8"/>
    <text x="308" y="151" text-anchor="middle">C</text>
    <rect class="bx" x="138" y="204" width="64" height="32" rx="8"/>
    <text x="170" y="225" text-anchor="middle">D</text>
    <text class="tx-s" x="212" y="77">받지 않음</text>
    <text class="tx-s" x="212" y="225">받지 않음</text>
    <text class="tx-s" x="0" y="264">포트마다 따로 오가니 충돌이 없음</text>
  </g>
