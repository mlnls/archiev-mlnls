  <rect class="bx" x="340" y="130" width="90" height="36" rx="6"/><text class="tx-b" x="385" y="153" text-anchor="middle">y</text>
  <rect class="bx" x="500" y="130" width="90" height="36" rx="6"/><text class="tx-b" x="545" y="153" text-anchor="middle">z</text>
  <line class="ln" x1="272" y1="142" x2="338" y2="142" marker-end="url(#a)"/>
