  <rect class="bx" x="0" y="270" width="180" height="32" rx="6"/>
  <text x="90" y="291" text-anchor="middle">머리말</text>
  <rect class="bx" x="0" y="306" width="180" height="48" rx="6"/>
  <text class="tx-m" x="90" y="335" text-anchor="middle">.text .data</text>
  <text class="tx-s" x="190" y="290">① 형식, CPU 확인</text>
  <line class="ln ln-dash" x1="180" y1="330" x2="340" y2="322" marker-end="url(#a)"/>
  <text class="tx-s" x="190" y="314">③ 연결만 해 둠</text>
  <text class="tx-s" x="190" y="352">읽기는 처음 쓸 때</text>
