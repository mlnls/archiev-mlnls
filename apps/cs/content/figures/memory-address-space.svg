<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path class="ah" d="M0 1 L9 5 L0 9 z"/>
    </marker>
  </defs>

  <text class="tx-l" x="130" y="30" text-anchor="end">높은 주소</text>
  <text class="tx-l" x="130" y="346" text-anchor="end">낮은 주소</text>

  <!-- 커널 -->
  <rect class="bx-soft" x="150" y="12" width="280" height="36" rx="6"/>
  <text x="290" y="35" text-anchor="middle">커널 영역</text>
  <text class="tx-s" x="450" y="35">사용자 모드에서는 접근 못 함</text>

  <!-- 스택 -->
  <rect class="bx" x="150" y="56" width="280" height="36" rx="6"/>
  <text class="tx-b" x="290" y="79" text-anchor="middle">스택</text>
  <text class="tx-s" x="450" y="72">함수 호출마다 아래로 자람</text>
  <text class="tx-s" x="450" y="88">스레드마다 하나</text>
  <line class="ln" x1="290" y1="94" x2="290" y2="118" marker-end="url(#a)"/>

  <rect class="bx-dash" x="150" y="96" width="280" height="44" rx="6"/>
  <text class="tx-s" x="380" y="123" text-anchor="middle">비어 있음</text>

  <!-- 메모리 매핑 -->
  <rect class="bx" x="150" y="148" width="280" height="36" rx="6"/>
  <text class="tx-b" x="290" y="171" text-anchor="middle">메모리 매핑 영역</text>
  <text class="tx-s" x="450" y="171">동적 라이브러리, 매핑한 파일</text>

  <rect class="bx-dash" x="150" y="188" width="280" height="44" rx="6"/>
  <text class="tx-s" x="380" y="215" text-anchor="middle">비어 있음</text>
  <line class="ln" x1="290" y1="238" x2="290" y2="214" marker-end="url(#a)"/>

  <!-- 힙 -->
  <rect class="bx" x="150" y="240" width="280" height="36" rx="6"/>
  <text class="tx-b" x="290" y="263" text-anchor="middle">힙</text>
  <text class="tx-s" x="450" y="263">malloc, new, JS 객체. 위로 자람</text>

  <!-- 실행 파일에서 온 영역 -->
  <rect class="bx" x="150" y="284" width="280" height="22" rx="4"/>
  <text class="tx-s tx-m" x="164" y="299">.bss .data</text>
  <text class="tx-s" x="450" y="299">전역 변수</text>
  <rect class="bx" x="150" y="306" width="280" height="22" rx="4"/>
  <text class="tx-s tx-m" x="164" y="321">.rodata</text>
  <text class="tx-s" x="450" y="321">상수, 문자열</text>
  <rect class="bx-ink" x="150" y="328" width="280" height="24" rx="4"/>
  <text class="tx-m tx-inv" x="164" y="344">.text</text>
  <text class="tx-s" x="450" y="344">기계어 코드. 읽기·실행만</text>

  <text class="tx-l" x="0" y="320">실행 파일에서</text>
  <text class="tx-l" x="0" y="336">온 부분</text>
</svg>
