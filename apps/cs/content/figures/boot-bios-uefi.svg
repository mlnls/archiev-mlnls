<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 262">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path class="ah-ink" d="M0 1 L9 5 L0 9 z"/>
    </marker>
  </defs>

  <!-- 레거시 BIOS -->
  <text class="tx-b" x="0" y="16">레거시 BIOS</text>
  <rect class="bx" x="0" y="28" width="110" height="48" rx="8"/>
  <text x="55" y="57" text-anchor="middle">BIOS</text>
  <line class="ln-ink" x1="110" y1="52" x2="146" y2="52" marker-end="url(#a)"/>
  <rect class="bx-ink" x="150" y="28" width="150" height="48" rx="6"/>
  <text class="tx-inv" x="225" y="49" text-anchor="middle" font-weight="700">첫 512바이트</text>
  <text class="tx-inv tx-s" x="225" y="67" text-anchor="middle">끝 두 바이트 55 AA</text>
  <rect class="bx-soft" x="304" y="28" width="416" height="48" rx="6"/>
  <text class="tx-s" x="512" y="57" text-anchor="middle">나머지 디스크 (파티션들). BIOS는 이 안을 읽을 줄 모름</text>
  <text class="tx-s" x="150" y="98">맨 앞 512바이트를 메모리 0x7C00에 올려 그대로 실행. 그 코드가 더 큰 부트로더를 불러옴</text>

  <line class="ln-faint" x1="0" y1="120" x2="720" y2="120"/>

  <!-- UEFI -->
  <text class="tx-b" x="0" y="146">UEFI</text>
  <rect class="bx" x="0" y="160" width="110" height="48" rx="8"/>
  <text x="55" y="189" text-anchor="middle">UEFI</text>
  <line class="ln-ink" x1="110" y1="184" x2="146" y2="184" marker-end="url(#a)"/>
  <rect class="bx" x="150" y="160" width="190" height="48" rx="8"/>
  <text x="166" y="180">NVRAM 부팅 항목</text>
  <text class="tx-s" x="166" y="198">1번: ubuntu, shimx64.efi</text>

  <rect class="bx-soft" x="380" y="134" width="340" height="124" rx="8"/>
  <text class="tx-l" x="392" y="152">디스크</text>
  <rect class="bx" x="392" y="160" width="204" height="90" rx="6"/>
  <text class="tx-l" x="404" y="178">ESP (FAT32 파티션)</text>
  <g class="tx-s tx-m">
    <text x="404" y="200">/EFI/Microsoft/…/bootmgfw</text>
  </g>
  <rect class="bx-ink" x="398" y="208" width="178" height="20" rx="4"/>
  <text class="tx-s tx-m tx-inv" x="404" y="222">/EFI/ubuntu/shimx64.efi</text>
  <text class="tx-s tx-m" x="404" y="242">/EFI/ubuntu/grubx64.efi</text>
  <text class="tx-s" x="608" y="200">Windows,</text>
  <text class="tx-s" x="608" y="216">Ubuntu 파티션</text>
  <path class="ln-ink" d="M340 184 H362 V218 H394" marker-end="url(#a)"/>
</svg>
