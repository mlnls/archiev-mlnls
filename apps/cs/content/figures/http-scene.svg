<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 222">
  <defs>
    <marker id="m" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0 1 L9 5 L0 9 z"/></marker>
    <marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah-ink" d="M0 1 L9 5 L0 9 z"/></marker>
  </defs>
  <rect class="bx" x="0" y="0" width="140" height="46" rx="8"/>
  <text class="tx-b" x="70" y="20" text-anchor="middle">브라우저</text>
  <text class="tx-s" x="70" y="37" text-anchor="middle">이 페이지의 탭</text>
  <rect class="bx-dash" x="150" y="11" width="170" height="24" rx="12"/>
  <text class="tx-l" x="235" y="27" text-anchor="middle">TLS로 암호화된 통로</text>
  <rect class="bx-ink" x="330" y="0" width="150" height="46" rx="8"/>
  <text class="tx-inv" x="405" y="20" text-anchor="middle" font-weight="700">Caddy :443</text>
  <text class="tx-inv tx-s" x="405" y="37" text-anchor="middle">TLS를 풀고 Host로 나눔</text>
  <line class="ln" x1="482" y1="23" x2="566" y2="23" marker-end="url(#m)"/>
  <text class="tx-l" x="524" y="16" text-anchor="middle">평문 HTTP</text>
  <rect class="bx" x="570" y="0" width="150" height="46" rx="8"/>
  <text class="tx-b" x="645" y="20" text-anchor="middle">nginx</text>
  <text class="tx-s" x="645" y="37" text-anchor="middle">mlnl-cs:80, 파일을 내줌</text>

  <text class="tx-l" x="0" y="70">요청</text>
  <rect class="bx-soft" x="0" y="78" width="340" height="80" rx="8"/>
  <g class="tx-m">
    <text x="12" y="100">GET /http/ HTTP/2</text>
    <text x="12" y="120">Host: cs.mlnl.cloud</text>
    <text x="12" y="140">Accept-Encoding: gzip, br, zstd</text>
  </g>
  <text class="tx-l" x="330" y="120" text-anchor="end">Caddy가 보고 나눔</text>

  <text class="tx-l" x="380" y="70">응답</text>
  <rect class="bx-soft" x="380" y="78" width="340" height="140" rx="8"/>
  <g class="tx-m">
    <text x="392" y="100">HTTP/2 200</text>
    <text x="392" y="120">Content-Type: text/html</text>
    <text x="392" y="140">Cache-Control: no-cache</text>
    <text x="392" y="160">Content-Encoding: zstd</text>
    <text x="392" y="180">Strict-Transport-Security</text>
    <text class="tx-s" x="392" y="206">&lt;!doctype html&gt;…</text>
  </g>
  <g class="tx-l" text-anchor="end">
    <text x="710" y="120">nginx</text><text x="710" y="140">nginx</text><text x="710" y="160">Caddy</text><text x="710" y="180">Caddy</text>
  </g>
</svg>
