  <text class="tx-s" x="436" y="181">4바이트</text>
  <rect class="bx-ink" x="496" y="160" width="80" height="32" rx="5"/>
  <rect class="bx-ink" x="580" y="160" width="80" height="32" rx="5"/>
  <g class="tx-m tx-inv" text-anchor="middle">
