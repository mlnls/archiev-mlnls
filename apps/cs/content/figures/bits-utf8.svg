    <text x="64" y="16">번호 (코드 포인트)</text>
    <text x="196" y="16">UTF-8로 적으면 (웹, 파일)</text>
    <text x="496" y="16">UTF-16으로 적으면 (JS 문자열)</text>
  </g>
  <line class="ln-faint" x1="0" y1="26" x2="720" y2="26"/>

  <!-- A -->
