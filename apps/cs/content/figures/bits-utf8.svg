  <text class="tx-m" x="112" y="121" text-anchor="middle">U+AC00</text>
  <g class="bx">
    <rect x="196" y="100" width="52" height="32" rx="5"/><rect x="252" y="100" width="52" height="32" rx="5"/><rect x="308" y="100" width="52" height="32" rx="5"/>
  </g>
  <g class="tx-m" text-anchor="middle">
    <text x="222" y="121">EA</text><text x="278" y="121">B0</text><text x="334" y="121">80</text>
  </g>
