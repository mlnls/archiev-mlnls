  <text class="tx-m" x="536" y="121" text-anchor="middle">AC00</text>
  <text class="tx-s" x="670" y="121">2바이트</text>

  <!-- 😀 -->
  <text x="14" y="182" text-anchor="middle">😀</text>
  <rect class="bx-soft" x="64" y="160" width="96" height="32" rx="5"/>
  <text class="tx-m" x="112" y="181" text-anchor="middle">U+1F600</text>
  <g class="bx">
