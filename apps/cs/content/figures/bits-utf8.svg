  <rect class="bx-soft" x="64" y="40" width="96" height="32" rx="5"/>
  <text class="tx-m" x="112" y="61" text-anchor="middle">U+0041</text>
  <rect class="bx" x="196" y="40" width="52" height="32" rx="5"/>
