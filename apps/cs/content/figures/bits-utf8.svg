  <text class="tx-s" x="436" y="61">1바이트</text>
  <rect class="bx" x="496" y="40" width="80" height="32" rx="5"/>
  <text class="tx-m" x="536" y="61" text-anchor="middle">0041</text>
  <text class="tx-s" x="670" y="61">2바이트</text>

  <!-- 가 -->
