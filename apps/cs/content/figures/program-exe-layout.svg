<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path class="ah" d="M0 1 L9 5 L0 9 z"/>
    </marker>
    <marker id="k" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path class="ah-ink" d="M0 1 L9 5 L0 9 z"/>
    </marker>
  </defs>
  <text class="tx-l" x="40" y="14">실행 파일 (ELF의 예)</text>

  <rect class="bx" x="40" y="22" width="220" height="56" rx="6"/>
  <text class="tx-b" x="56" y="44">머리말</text>
  <text class="tx-s tx-m" x="56" y="64">7F 45 4C 46 …</text>
  <rect class="bx-ink" x="40" y="82" width="220" height="56" rx="6"/>
  <text class="tx-inv" x="56" y="104" font-weight="700">코드</text>
  <text class="tx-inv tx-s tx-m" x="56" y="124">.text</text>
  <rect class="bx" x="40" y="142" width="220" height="30" rx="6"/>
  <text class="tx-m" x="56" y="162">.rodata</text>
  <rect class="bx" x="40" y="176" width="220" height="30" rx="6"/>
  <text class="tx-m" x="56" y="196">.data</text>
  <rect class="bx-dash" x="40" y="210" width="220" height="30" rx="6"/>
  <text class="tx-m" x="56" y="230">.bss</text>
  <rect class="bx" x="40" y="244" width="220" height="30" rx="6"/>
  <text x="56" y="264">심볼 표</text>

  <!-- 엔트리 포인트: 머리말이 코드 안의 시작 위치를 가리킴 -->
  <polyline class="ln-ink" points="40,50 18,50 18,110 38,110" marker-end="url(#k)"/>

  <g class="ln-faint">
    <line x1="260" y1="50" x2="290" y2="50"/>
    <line x1="260" y1="110" x2="290" y2="110"/>
    <line x1="260" y1="157" x2="290" y2="157"/>
    <line x1="260" y1="191" x2="290" y2="191"/>
    <line x1="260" y1="225" x2="290" y2="225"/>
    <line x1="260" y1="259" x2="290" y2="259"/>
  </g>
  <text x="300" y="45">어떤 CPU용인지, 필요한 동적 라이브러리,</text>
  <text x="300" y="63">어디서부터 실행할지(엔트리 포인트, 왼쪽 화살표)</text>
  <text x="300" y="105">기계어 명령어</text>
  <text class="tx-s" x="300" y="123">읽기와 실행만 되고 쓰기는 막힘</text>
  <text x="300" y="162">문자열 상수 <tspan class="tx-s tx-m">"hello\n"</tspan></text>
  <text x="300" y="196">초기값이 있는 전역 변수</text>
  <text x="300" y="230">0으로 시작하는 전역 변수 <tspan class="tx-s">(파일에는 크기만)</tspan></text>
  <text x="300" y="264">함수·변수 이름 <tspan class="tx-s">(디버거, 오류 스택용. 지우기도 함)</tspan></text>
</svg>
