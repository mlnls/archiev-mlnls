<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 290">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path class="ah-ink" d="M0 1 L9 5 L0 9 z"/>
    </marker>
  </defs>

  <!-- 층 -->
  <text class="tx-b" x="0" y="66">사용자 공간</text>
  <text class="tx-b" x="0" y="170">커널</text>
  <text class="tx-b" x="0" y="260">하드웨어</text>
  <line class="ln ln-dash" x1="100" y1="112" x2="720" y2="112"/>
  <text class="tx-s" x="720" y="106" text-anchor="end">CPU가 지키는 벽</text>
  <line class="ln-faint" x1="100" y1="214" x2="720" y2="214"/>

  <!-- 사용자 공간 -->
  <rect class="bx" x="210" y="38" width="160" height="50" rx="8"/>
  <text class="tx-b" x="290" y="60" text-anchor="middle">창 관리자</text>
  <text class="tx-s" x="290" y="78" text-anchor="middle">WindowServer, win32k</text>
  <rect class="bx-ink" x="420" y="38" width="170" height="50" rx="8"/>
  <text class="tx-inv" x="505" y="60" text-anchor="middle" font-weight="700">브라우저</text>
  <text class="tx-inv tx-s" x="505" y="78" text-anchor="middle">체크 → localStorage에 기록</text>

  <!-- 커널 -->
  <rect class="bx" x="110" y="140" width="210" height="50" rx="8"/>
