  <text class="tx-s" x="215" y="179" text-anchor="middle">마우스 드라이버</text>
  <rect class="bx" x="470" y="140" width="210" height="50" rx="8"/>
  <text x="575" y="161" text-anchor="middle">파일 시스템</text>
  <text class="tx-s" x="575" y="179" text-anchor="middle">SSD 드라이버</text>

  <!-- 하드웨어 -->
  <rect class="bx-soft" x="110" y="232" width="110" height="44" rx="8"/>
  <text x="165" y="259" text-anchor="middle">마우스</text>
  <rect class="bx-soft" x="570" y="232" width="110" height="44" rx="8"/>
  <text x="625" y="259" text-anchor="middle">SSD</text>

  <!-- 흐름 -->
  <g class="ln-ink">
    <line x1="165" y1="232" x2="165" y2="194" marker-end="url(#a)"/>
    <line x1="290" y1="140" x2="290" y2="92" marker-end="url(#a)"/>
    <line x1="370" y1="63" x2="416" y2="63" marker-end="url(#a)"/>
    <line x1="530" y1="88" x2="530" y2="136" marker-end="url(#a)"/>
    <line x1="625" y1="190" x2="625" y2="228" marker-end="url(#a)"/>
  </g>
  <g class="tx-s">
    <text x="174" y="218">① 인터럽트</text>
    <text x="298" y="128">② 클릭 사건 전달</text>
    <text x="374" y="54">③</text>
    <text x="538" y="128">④ write 시스템 콜</text>
    <text x="633" y="208">⑤ 장치 명령</text>
