<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 350">
  <text class="tx-b" x="20" y="24">(user_id, created_at) 인덱스</text>
  <text class="tx-s" x="20" y="44">리프에 정렬된 순서 그대로</text>

  <rect class="bx-soft" x="20" y="70" width="80" height="24"/><rect class="bx-soft" x="100" y="70" width="130" height="24"/>
  <text class="tx-b" x="60" y="87" text-anchor="middle">user_id</text>
  <text class="tx-b" x="165" y="87" text-anchor="middle">created_at</text>
    <rect class="bx" x="20" y="94" width="80" height="24"/><rect class="bx" x="100" y="94" width="130" height="24"/>
  <text x="60" y="111" text-anchor="middle">1</text><text class="tx-s tx-m" x="165" y="110" text-anchor="middle">2026-10-02</text>
  <rect class="bx" x="20" y="118" width="80" height="24"/><rect class="bx" x="100" y="118" width="130" height="24"/>
  <text x="60" y="135" text-anchor="middle">1</text><text class="tx-s tx-m" x="165" y="134" text-anchor="middle">2026-11-01</text>
  <rect class="bx" x="20" y="142" width="80" height="24"/><rect class="bx" x="100" y="142" width="130" height="24"/>
  <text x="60" y="159" text-anchor="middle">1</text><text class="tx-s tx-m" x="165" y="158" text-anchor="middle">2026-11-03</text>
  <rect class="bx" x="20" y="166" width="80" height="24"/><rect class="bx" x="100" y="166" width="130" height="24"/>
  <text x="60" y="183" text-anchor="middle">2</text><text class="tx-s tx-m" x="165" y="182" text-anchor="middle">2026-09-15</text>
  <rect class="bx" x="20" y="190" width="80" height="24"/><rect class="bx" x="100" y="190" width="130" height="24"/>
  <text x="60" y="207" text-anchor="middle">2</text><text class="tx-s tx-m" x="165" y="206" text-anchor="middle">2026-11-05</text>
  <rect class="bx" x="20" y="214" width="80" height="24"/><rect class="bx" x="100" y="214" width="130" height="24"/>
  <text x="60" y="231" text-anchor="middle">2</text><text class="tx-s tx-m" x="165" y="230" text-anchor="middle">2026-11-20</text>
  <rect class="bx" x="20" y="238" width="80" height="24"/><rect class="bx" x="100" y="238" width="130" height="24"/>
  <text x="60" y="255" text-anchor="middle">3</text><text class="tx-s tx-m" x="165" y="254" text-anchor="middle">2026-08-30</text>
  <rect class="bx" x="20" y="262" width="80" height="24"/><rect class="bx" x="100" y="262" width="130" height="24"/>
  <text x="60" y="279" text-anchor="middle">3</text><text class="tx-s tx-m" x="165" y="278" text-anchor="middle">2026-10-11</text>
  <rect class="bx" x="20" y="286" width="80" height="24"/><rect class="bx" x="100" y="286" width="130" height="24"/>
  <text x="60" y="303" text-anchor="middle">3</text><text class="tx-s tx-m" x="165" y="302" text-anchor="middle">2026-11-12</text>
  <line class="ln" x1="20" y1="166" x2="230" y2="166"/><line class="ln" x1="20" y1="238" x2="230" y2="238"/>

  <!-- 쿼리 1: 앞 열부터 -->
  <text class="tx-s tx-m" x="270" y="24">WHERE user_id = 1</text>
  <text class="tx-s tx-m" x="270" y="42">AND created_at &gt; '2026-11'</text>
  <path class="ln-ink" d="M262 120 H272 V164 H262"/>
  <text class="tx-b" x="284" y="138">한 덩어리로 붙어 있음</text>
  <text class="tx-s" x="284" y="156">찾아 내려가서 옆으로 두 칸</text>

  <!-- 쿼리 2: 앞 열 없이 -->
  <text class="tx-s tx-m" x="500" y="24">WHERE created_at &gt; '2026-11'</text>
  <text class="tx-s" x="500" y="42">(앞 열 user_id가 없음)</text>
  <circle class="dot" cx="510" cy="130" r="4"/><circle class="dot" cx="510" cy="154" r="4"/><circle class="dot" cx="510" cy="202" r="4"/><circle class="dot" cx="510" cy="226" r="4"/><circle class="dot" cx="510" cy="298" r="4"/>
  <text class="tx-b" x="530" y="210">user_id마다 흩어져 있음</text>
  <text class="tx-s" x="530" y="228">어디서 시작할지 몰라</text>
  <text class="tx-s" x="530" y="246">전부 훑어야 함</text>

  <text class="tx-s" x="20" y="334">전화번호부가 성으로 먼저, 같은 성 안에서 이름으로 정렬된 것처럼, 먼저 user_id로 그다음 created_at으로 정렬됩니다.</text>
</svg>
