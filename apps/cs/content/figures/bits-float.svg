<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 176">
  <!-- 64비트 = 1 + 11 + 52. 1비트 = 11.25px -->
  <text class="tx-l" x="0" y="26">부호 1</text>
  <text class="tx-l" x="73" y="26" text-anchor="middle">지수 11비트</text>
  <text class="tx-l" x="427" y="26" text-anchor="middle">가수 52비트 (유효 숫자)</text>

  <rect class="bx-ink" x="0" y="34" width="11" height="38" rx="2"/>
  <rect class="bx-soft" x="12" y="34" width="122" height="38" rx="4"/>
  <rect class="bx" x="135" y="34" width="585" height="38" rx="4"/>
  <text class="tx-m" x="73" y="58" text-anchor="middle">01111111011</text>
  <text class="tx-m" x="427" y="58" text-anchor="middle">1001 1001 1001 1001 1001 1001 1001 … 1001 1001 1010</text>

  <text class="tx-b" x="0" y="104">0.1을 이렇게 적습니다</text>
  <text class="tx-s" x="0" y="124">2진수로 0.1 = 0.0001 1001 1001 1001 … 1001이 끝없이 반복되니 52비트에서 잘라 반올림합니다 (끝의 1010)</text>
  <text class="tx-s" x="0" y="144">그래서 실제로 담긴 값은 0.1000000000000000055511151231257827… 로, 0.1보다 아주 조금 큽니다</text>
  <text class="tx-s" x="0" y="164">0.25 = 2진수 0.01, 0.75 = 0.11처럼 2의 거듭제곱으로 끝나는 소수는 오차 없이 담깁니다</text>
</svg>
