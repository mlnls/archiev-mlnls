  </g>
  <rect class="bx-ink" x="150" y="148" width="118" height="34" rx="6"/>
  <text class="tx-inv tx-m" x="209" y="170" text-anchor="middle">chmod 754</text>
  <text class="tx-s" x="17" y="80" text-anchor="middle">종류</text>
  <text class="tx-s" x="17" y="96" text-anchor="middle">- 파일</text>
  <text class="tx-s" x="420" y="132">r = 4, w = 2, x = 1을 무리마다 더해</text>
