  <!-- 묶음 표시 -->
  <g class="ln">
    <path d="M40 58 V64 H146 V58"/><path d="M156 58 V64 H262 V58"/><path d="M272 58 V64 H378 V58"/>
  </g>
  <g text-anchor="middle">
    <text class="tx-b" x="93" y="86">주인 (me)</text><text class="tx-b" x="209" y="86">그룹 (staff)</text><text class="tx-b" x="325" y="86">나머지</text>
  </g>
  <g class="tx-s" text-anchor="middle">
    <text x="93" y="104">읽기, 쓰기, 실행</text><text x="209" y="104">읽기, 실행</text><text x="325" y="104">읽기만</text>
  </g>
  <g class="tx-m" text-anchor="middle">
