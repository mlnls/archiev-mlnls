<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 196">
  <!-- -rwxr-xr--  1 me  staff  1200  deploy.sh -->
  <rect class="bx-soft" x="0" y="10" width="34" height="40" rx="5"/>
  <g class="bx">
    <rect x="40" y="10" width="34" height="40" rx="5"/><rect x="76" y="10" width="34" height="40" rx="5"/><rect x="112" y="10" width="34" height="40" rx="5"/>
    <rect x="156" y="10" width="34" height="40" rx="5"/><rect x="192" y="10" width="34" height="40" rx="5"/><rect x="228" y="10" width="34" height="40" rx="5"/>
    <rect x="272" y="10" width="34" height="40" rx="5"/><rect x="308" y="10" width="34" height="40" rx="5"/><rect x="344" y="10" width="34" height="40" rx="5"/>
  </g>
  <g class="tx-m" text-anchor="middle">
    <text x="17" y="35">-</text>
    <text x="57" y="35">r</text><text x="93" y="35">w</text><text x="129" y="35">x</text>
    <text x="173" y="35">r</text><text x="209" y="35">-</text><text x="245" y="35">x</text>
    <text x="289" y="35">r</text><text x="325" y="35">-</text><text x="361" y="35">-</text>
  </g>
