  <text x="495" y="372" text-anchor="middle">2. POST /transfer</text>
  <line class="ln" x1="360" y1="380" x2="628" y2="380" marker-end="url(#a)"/>
  <text class="tx-s" x="495" y="396" text-anchor="middle">쿠키가 안 붙음 → 로그인 안 된 요청으로 거절</text>
