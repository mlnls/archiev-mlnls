  <line class="ln ln-dash" x1="360" y1="290" x2="92" y2="290" marker-end="url(#a)"/>
  <text class="tx-s" x="225" y="306" text-anchor="middle">하지만 송금은 이미 끝난 뒤</text>

  <line class="ln" x1="0" y1="330" x2="720" y2="330"/>
