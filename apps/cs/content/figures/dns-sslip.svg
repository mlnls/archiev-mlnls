<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 250">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path class="ah" d="M0 1 L9 5 L0 9 z"/>
    </marker>
  </defs>
  <!-- 이름을 나누어 보기 -->
  <rect class="bx" x="170" y="20" width="80" height="36" rx="6"/>
  <text class="tx-m" x="210" y="43" text-anchor="middle">cs.mlnl</text>
  <text class="tx-b" x="260" y="44" text-anchor="middle">.</text>
  <rect class="bx-ink" x="270" y="20" width="130" height="36" rx="6"/>
  <text class="tx-m tx-inv" x="335" y="43" text-anchor="middle">54-116-117-190</text>
  <text class="tx-b" x="410" y="44" text-anchor="middle">.</text>
  <rect class="bx" x="420" y="20" width="84" height="36" rx="6"/>
  <text class="tx-m" x="462" y="43" text-anchor="middle">sslip.io</text>
  <text class="tx-s" x="210" y="78" text-anchor="middle">아무 이름표</text>
  <text class="tx-s" x="335" y="78" text-anchor="middle">IP를 -로 적은 부분</text>
  <text class="tx-s" x="462" y="78" text-anchor="middle">등록된 도메인</text>

  <line class="ln ln-dash" x1="335" y1="88" x2="335" y2="128" marker-end="url(#a)"/>
  <text class="tx-s" x="345" y="112">이 부분을 읽음</text>

  <!-- 조회 흐름 -->
  <rect class="bx" x="0" y="130" width="100" height="60" rx="8"/>
  <text class="tx-b" x="50" y="155" text-anchor="middle">루트</text>
  <text class="tx-s" x="50" y="176" text-anchor="middle">".io는 저기"</text>
  <line class="ln" x1="100" y1="160" x2="128" y2="160" marker-end="url(#a)"/>
  <rect class="bx" x="130" y="130" width="120" height="60" rx="8"/>
  <text class="tx-b" x="190" y="155" text-anchor="middle">.io 서버</text>
  <text class="tx-s" x="190" y="176" text-anchor="middle">"sslip.io는 저기"</text>
  <line class="ln" x1="250" y1="160" x2="278" y2="160" marker-end="url(#a)"/>
  <rect class="bx" x="280" y="130" width="240" height="72" rx="8"/>
  <text class="tx-b" x="400" y="152" text-anchor="middle">sslip.io 네임서버</text>
  <text class="tx-s" x="400" y="172" text-anchor="middle">레코드 목록 없이</text>
  <text class="tx-s" x="400" y="190" text-anchor="middle">이름을 읽어 그 자리에서 답을 만듦</text>
  <line class="ln" x1="520" y1="166" x2="558" y2="166" marker-end="url(#a)"/>
  <rect class="bx" x="560" y="130" width="160" height="72" rx="8"/>
  <text class="tx-b" x="640" y="158" text-anchor="middle">답 (A 레코드)</text>
  <text class="tx-s tx-m" x="640" y="182" text-anchor="middle">54.116.117.190</text>

  <text class="tx-s" x="0" y="238">어떤 이름이 와도 규칙대로 답하는 와일드카드 DNS라, 도메인을 사지 않아도 공개 DNS에서 풀립니다.</text>
</svg>
