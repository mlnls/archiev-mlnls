<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 340">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path class="ah-ink" d="M0 1 L9 5 L0 9 z"/>
    </marker>
    <marker id="m" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path class="ah" d="M0 1 L9 5 L0 9 z"/>
    </marker>
  </defs>
  <text class="tx-b" x="0" y="40">브라우저</text>
  <text class="tx-b" x="0" y="160">커널</text>
  <text class="tx-b" x="0" y="300">SSD</text>
  <line class="ln ln-dash" x1="100" y1="84" x2="720" y2="84"/>
  <text class="tx-s" x="720" y="78" text-anchor="end">시스템 콜</text>
  <line class="ln-faint" x1="100" y1="256" x2="720" y2="256"/>

  <!-- 브라우저 -->
  <rect class="bx-ink" x="100" y="16" width="210" height="50" rx="8"/>
  <text class="tx-inv tx-m" x="205" y="37" text-anchor="middle">localStorage.setItem</text>
  <text class="tx-inv tx-s" x="205" y="55" text-anchor="middle">{"bits:read":1}</text>
  <rect class="bx" x="360" y="16" width="360" height="50" rx="8"/>
  <text x="376" y="37">브라우저 프로필 폴더의 저장소 파일</text>
  <text class="tx-s tx-m" x="376" y="55">…/Default/Local Storage/leveldb/000123.log</text>
  <line class="ln-ink" x1="310" y1="41" x2="356" y2="41" marker-end="url(#a)"/>

  <!-- 커널 -->
  <rect class="bx" x="100" y="104" width="190" height="56" rx="8"/>
  <text x="195" y="126" text-anchor="middle">write(fd, …)</text>
  <text class="tx-s" x="195" y="146" text-anchor="middle">fd가 가리키는 파일에</text>
  <rect class="bx" x="330" y="104" width="190" height="56" rx="8"/>
  <text x="425" y="126" text-anchor="middle">페이지 캐시 (RAM)</text>
  <text class="tx-s" x="425" y="146" text-anchor="middle">여기 적고 바로 돌아옴</text>
  <rect class="bx" x="330" y="184" width="190" height="56" rx="8"/>
  <text x="425" y="206" text-anchor="middle">파일 시스템</text>
  <text class="tx-s" x="425" y="226" text-anchor="middle">파일의 몇 번째 → 블록 몇 번</text>
  <rect class="bx" x="560" y="184" width="160" height="56" rx="8"/>
  <text x="640" y="206" text-anchor="middle">SSD 드라이버</text>
  <text class="tx-s" x="640" y="226" text-anchor="middle">장치 명령 + DMA</text>

  <path class="ln-ink" d="M540 66 V90 H195 V100" marker-end="url(#a)"/>
  <line class="ln-ink" x1="290" y1="132" x2="326" y2="132" marker-end="url(#a)"/>
  <line class="ln ln-dash" x1="425" y1="160" x2="425" y2="180" marker-end="url(#m)"/>
  <text class="tx-s" x="535" y="150">나중에 모아서,</text>
  <text class="tx-s" x="535" y="166">또는 fsync를 부르면 지금</text>
  <line class="ln" x1="520" y1="212" x2="556" y2="212" marker-end="url(#m)"/>

  <!-- SSD -->
  <g class="bx">
    <rect x="360" y="276" width="34" height="34" rx="4"/><rect x="398" y="276" width="34" height="34" rx="4"/>
    <rect x="436" y="276" width="34" height="34" rx="4"/><rect x="512" y="276" width="34" height="34" rx="4"/>
    <rect x="550" y="276" width="34" height="34" rx="4"/><rect x="588" y="276" width="34" height="34" rx="4"/>
    <rect x="626" y="276" width="34" height="34" rx="4"/><rect x="664" y="276" width="34" height="34" rx="4"/>
  </g>
  <rect class="bx-ink" x="474" y="276" width="34" height="34" rx="4"/>
  <text class="tx-s" x="100" y="298">번호 붙은 블록의 나열일 뿐</text>
  <text class="tx-s" x="100" y="316">파일도 폴더도 모름</text>
  <line class="ln" x1="640" y1="240" x2="500" y2="272" marker-end="url(#m)"/>
  <text class="tx-s tx-m" x="491" y="330" text-anchor="middle">블록 81,512</text>
</svg>
