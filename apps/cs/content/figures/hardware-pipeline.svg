    <text x="135" y="14">1</text><text x="185" y="14">2</text><text x="235" y="14">3</text><text x="285" y="14">4</text>
    <text x="335" y="14">5</text><text x="385" y="14">6</text><text x="435" y="14">7</text><text x="485" y="14">8</text>
