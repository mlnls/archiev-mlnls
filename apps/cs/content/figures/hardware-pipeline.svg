    <rect x="261" y="72" width="48" height="20" rx="3"/><rect x="311" y="72" width="48" height="20" rx="3"/><rect x="361" y="72" width="48" height="20" rx="3"/>
    <rect x="411" y="96" width="48" height="20" rx="3"/><rect x="461" y="96" width="48" height="20" rx="3"/><rect x="511" y="96" width="48" height="20" rx="3"/>
    <rect x="561" y="120" width="48" height="20" rx="3"/><rect x="611" y="120" width="48" height="20" rx="3"/><rect x="661" y="120" width="48" height="20" rx="3"/>
