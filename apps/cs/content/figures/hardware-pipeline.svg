    <text x="435" y="110">F</text><text x="485" y="110">D</text><text x="535" y="110">E</text>
    <text x="585" y="134">F</text><text x="635" y="134">D</text><text x="685" y="134">E</text>
  </g>

  <line class="ln-faint" x1="0" y1="156" x2="720" y2="156"/>

  <!-- 겹치기 -->
  <text class="tx-b" x="0" y="182">단계를 겹치면 6클럭</text>
  <g class="tx-s">
    <text x="0" y="204">명령어 1</text><text x="0" y="228">명령어 2</text><text x="0" y="252">명령어 3</text><text x="0" y="276">명령어 4</text>
  </g>
  <g class="bx-soft">
    <rect x="111" y="190" width="48" height="20" rx="3"/><rect x="161" y="190" width="48" height="20" rx="3"/>
    <rect x="161" y="214" width="48" height="20" rx="3"/><rect x="211" y="214" width="48" height="20" rx="3"/>
    <rect x="211" y="238" width="48" height="20" rx="3"/><rect x="261" y="238" width="48" height="20" rx="3"/>
    <rect x="261" y="262" width="48" height="20" rx="3"/><rect x="311" y="262" width="48" height="20" rx="3"/>
