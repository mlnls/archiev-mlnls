<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 320">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path class="ah" d="M0 1 L9 5 L0 9 z"/>
    </marker>
    <marker id="k" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path class="ah-ink" d="M0 1 L9 5 L0 9 z"/>
    </marker>
  </defs>
  <!-- 내 컴퓨터 -->
  <rect class="bx" x="0" y="120" width="160" height="100" rx="8"/>
  <text class="tx-b" x="80" y="160" text-anchor="middle">내 컴퓨터</text>
  <text class="tx-s" x="80" y="182" text-anchor="middle">브라우저 → OS</text>
  <text class="tx-s" x="80" y="200" text-anchor="middle">(스텁 리졸버)</text>

  <!-- 재귀 질의 -->
  <line class="ln-ink" x1="160" y1="145" x2="258" y2="145" marker-end="url(#k)"/>
  <line class="ln" x1="258" y1="195" x2="162" y2="195" marker-end="url(#a)"/>
  <circle class="dot" cx="209" cy="145" r="9"/>
  <text class="tx-s tx-inv" x="209" y="149" text-anchor="middle">1</text>
  <circle class="dot" cx="209" cy="195" r="9"/>
  <text class="tx-s tx-inv" x="209" y="199" text-anchor="middle">5</text>
  <text class="tx-s" x="209" y="174" text-anchor="middle">UDP 53</text>
  <text class="tx-l" x="80" y="250" text-anchor="middle">재귀 질의</text>
  <text class="tx-s" x="80" y="268" text-anchor="middle">"끝까지 찾아서 답만"</text>

  <!-- 재귀 리졸버 -->
  <rect class="bx" x="260" y="110" width="160" height="120" rx="8"/>
  <text class="tx-b" x="340" y="138" text-anchor="middle">재귀 리졸버</text>
  <text class="tx-s" x="340" y="157" text-anchor="middle">통신사 DNS, 8.8.8.8</text>
  <rect class="bx-soft" x="272" y="172" width="136" height="44" rx="6"/>
  <text class="tx-s" x="340" y="190" text-anchor="middle">캐시에 있으면</text>
  <text class="tx-s" x="340" y="207" text-anchor="middle">2~4단계 건너뜀</text>
  <text class="tx-l" x="340" y="255" text-anchor="middle">반복 질의</text>
  <text class="tx-s" x="340" y="273" text-anchor="middle">"아는 만큼만 알려 줘"</text>

  <!-- 루트 -->
  <line class="ln" x1="420" y1="132" x2="518" y2="47" marker-end="url(#a)"/>
  <line class="ln ln-dash" x1="518" y1="63" x2="422" y2="146" marker-end="url(#a)"/>
  <rect class="bx" x="520" y="20" width="200" height="70" rx="8"/>
  <circle class="dot" cx="540" cy="43" r="9"/>
  <text class="tx-s tx-inv" x="540" y="47" text-anchor="middle">2</text>
  <text class="tx-b" x="556" y="48">루트 네임서버</text>
  <text class="tx-s" x="540" y="72">".com은 저 서버들에게"</text>

  <!-- TLD -->
  <line class="ln" x1="420" y1="160" x2="518" y2="157" marker-end="url(#a)"/>
  <line class="ln ln-dash" x1="518" y1="173" x2="422" y2="176" marker-end="url(#a)"/>
  <rect class="bx" x="520" y="130" width="200" height="70" rx="8"/>
  <circle class="dot" cx="540" cy="153" r="9"/>
  <text class="tx-s tx-inv" x="540" y="157" text-anchor="middle">3</text>
  <text class="tx-b" x="556" y="158">.com 네임서버</text>
  <text class="tx-s" x="540" y="182">"example.com은 저 서버들에게"</text>

  <!-- 권한 있는 네임서버 -->
  <line class="ln" x1="420" y1="190" x2="518" y2="267" marker-end="url(#a)"/>
  <line class="ln ln-dash" x1="518" y1="283" x2="422" y2="206" marker-end="url(#a)"/>
  <rect class="bx" x="520" y="240" width="200" height="70" rx="8"/>
  <circle class="dot" cx="540" cy="263" r="9"/>
  <text class="tx-s tx-inv" x="540" y="267" text-anchor="middle">4</text>
  <text class="tx-b" x="556" y="268">example.com 네임서버</text>
  <text class="tx-s tx-m" x="540" y="292">A 203.0.113.10, TTL 3600</text>
  <text class="tx-s" x="540" y="232">권한 있는 네임서버</text>
</svg>
