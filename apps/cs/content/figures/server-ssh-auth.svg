<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 370">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path class="ah" d="M0 1 L9 5 L0 9 z"/>
    </marker>
    <marker id="k" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path class="ah-ink" d="M0 1 L9 5 L0 9 z"/>
    </marker>
  </defs>
  <!-- 양쪽 -->
  <rect class="bx" x="70" y="10" width="160" height="36" rx="8"/>
  <text class="tx-b" x="150" y="33" text-anchor="middle">내 컴퓨터 · ssh</text>
  <rect class="bx" x="490" y="10" width="160" height="36" rx="8"/>
  <text class="tx-b" x="570" y="33" text-anchor="middle">서버 · sshd :22</text>
  <line class="ln-faint" x1="150" y1="46" x2="150" y2="362"/>
  <line class="ln-faint" x1="570" y1="46" x2="570" y2="362"/>

  <text class="tx-l" x="0" y="76">서버 확인</text>
  <line class="ln" x1="152" y1="100" x2="566" y2="100" marker-end="url(#a)"/>
  <text x="360" y="92" text-anchor="middle">TCP 연결 (22번 포트)</text>
  <line class="ln" x1="568" y1="145" x2="154" y2="145" marker-end="url(#a)"/>
  <text x="360" y="137" text-anchor="middle">서버의 공개키, 키 교환 값</text>
  <text class="tx-s" x="0" y="140">지문을</text>
  <text class="tx-s" x="0" y="156">known_hosts와 비교</text>
  <line class="ln-ink" x1="154" y1="190" x2="566" y2="190" marker-start="url(#k)" marker-end="url(#k)"/>
  <text class="tx-b" x="360" y="182" text-anchor="middle">이제부터 오가는 모든 것이 암호화됨</text>

  <text class="tx-l" x="0" y="226">사용자 확인</text>
  <line class="ln" x1="568" y1="250" x2="154" y2="250" marker-end="url(#a)"/>
  <text x="360" y="242" text-anchor="middle">무작위 값</text>
  <line class="ln" x1="152" y1="295" x2="566" y2="295" marker-end="url(#a)"/>
  <text x="360" y="287" text-anchor="middle">개인키로 만든 서명</text>
  <text class="tx-s" x="0" y="290">개인키는</text>
  <text class="tx-s" x="0" y="306">나가지 않음</text>
  <text class="tx-s" x="580" y="290">authorized_keys의</text>
  <text class="tx-s" x="580" y="306">공개키로 확인</text>
  <line class="ln" x1="568" y1="340" x2="154" y2="340" marker-end="url(#a)"/>
  <text x="360" y="332" text-anchor="middle">셸이 열림</text>
</svg>
