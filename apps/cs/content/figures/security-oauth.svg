<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 436">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path class="ah" d="M0 1 L9 5 L0 9 z"/>
    </marker>
    <marker id="k" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path class="ah-ink" d="M0 1 L9 5 L0 9 z"/>
    </marker>
  </defs>
  <!-- 생명선 셋 -->
  <rect class="bx" x="15" y="10" width="150" height="36" rx="8"/>
  <text class="tx-b" x="90" y="33" text-anchor="middle">브라우저</text>
  <rect class="bx" x="295" y="10" width="150" height="36" rx="8"/>
  <text class="tx-b" x="370" y="33" text-anchor="middle">우리 서버</text>
  <rect class="bx" x="565" y="10" width="150" height="36" rx="8"/>
  <text class="tx-b" x="640" y="33" text-anchor="middle">Google</text>
  <g class="ln-faint">
    <line x1="90" y1="46" x2="90" y2="426"/>
    <line x1="370" y1="46" x2="370" y2="426"/>
    <line x1="640" y1="46" x2="640" y2="426"/>
  </g>

  <!-- 1 -->
  <text x="104" y="88">1. Google 로그인 페이지로 이동</text>
  <line class="ln" x1="90" y1="96" x2="638" y2="96" marker-end="url(#a)"/>
  <text class="tx-s" x="104" y="112">앱 ID, 돌아올 주소, 요청하는 권한</text>
  <!-- 2 -->
  <rect class="bx-soft" x="525" y="128" width="190" height="34" rx="6"/>
  <text x="620" y="150" text-anchor="middle">2. 로그인하고 동의</text>
  <!-- 3 -->
  <text x="104" y="192">3. 돌아올 주소로 + 일회용 코드</text>
  <line class="ln" x1="640" y1="200" x2="92" y2="200" marker-end="url(#a)"/>
  <!-- 4 -->
  <text x="230" y="242" text-anchor="middle">4. 코드를 서버에 전달</text>
  <line class="ln" x1="90" y1="250" x2="368" y2="250" marker-end="url(#a)"/>
  <text class="tx-s tx-m" x="230" y="266" text-anchor="middle">GET /callback?code=…</text>
  <!-- 5 -->
  <text class="tx-b" x="505" y="292" text-anchor="middle">5. 코드 + 앱 비밀 값</text>
  <line class="ln-ink" x1="370" y1="300" x2="638" y2="300" marker-end="url(#k)"/>
  <text class="tx-s" x="505" y="316" text-anchor="middle">서버끼리. 브라우저는 모름</text>
  <!-- 6 -->
  <text x="505" y="342" text-anchor="middle">6. ID 토큰(JWT)</text>
  <line class="ln" x1="640" y1="350" x2="372" y2="350" marker-end="url(#a)"/>
  <text class="tx-s" x="505" y="366" text-anchor="middle">이 사람이 누구인지 담김</text>
  <!-- 7 -->
  <text x="230" y="392" text-anchor="middle">7. 우리 서비스의 로그인 쿠키</text>
  <line class="ln" x1="370" y1="400" x2="92" y2="400" marker-end="url(#a)"/>
  <text class="tx-s" x="230" y="416" text-anchor="middle">Google 비밀번호는 한 번도 지나가지 않음</text>
</svg>
