<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 330">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path class="ah" d="M0 1 L9 5 L0 9 z"/>
    </marker>
    <marker id="k" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path class="ah-ink" d="M0 1 L9 5 L0 9 z"/>
    </marker>
  </defs>

  <!-- 쿼리 -->
  <rect class="bx" x="20" y="60" width="150" height="50" rx="8"/>
  <text class="tx-b" x="95" y="82" text-anchor="middle">쿼리 실행</text>
  <text class="tx-s" x="95" y="100" text-anchor="middle">페이지 7과 5가 필요</text>
  <line class="ln" x1="172" y1="85" x2="216" y2="85" marker-end="url(#a)"/>

  <!-- 메모리: 버퍼 풀 -->
  <rect class="bx-soft" x="200" y="22" width="500" height="128" rx="10"/>
  <text class="tx-l" x="212" y="42">메모리 · 버퍼 풀</text>
  <g>
    <rect class="bx" x="220" y="54" width="64" height="62" rx="6"/>
    <rect class="bx" x="300" y="54" width="64" height="62" rx="6"/>
    <rect class="bx" x="380" y="54" width="64" height="62" rx="6"/>
    <rect class="bx" x="460" y="54" width="64" height="62" rx="6"/>
    <rect class="bx" x="540" y="54" width="64" height="62" rx="6"/>
    <rect class="bx-dash" x="620" y="54" width="64" height="62" rx="6"/>
  </g>
  <g text-anchor="middle">
    <text class="tx-b" x="252" y="90">페이지 7</text>
    <text x="332" y="90">페이지 3</text>
    <text x="412" y="90">페이지 1</text>
    <text x="492" y="82">페이지 2</text>
    <text class="tx-s" x="492" y="102">고친 뒤</text>
    <text x="572" y="90">페이지 0</text>
    <text class="tx-s" x="652" y="90">빈 칸</text>
  </g>
  <text class="tx-s" x="220" y="138">있으면 메모리에서 바로 읽음</text>

  <!-- 디스크 -->
  <rect class="bx-soft" x="200" y="222" width="500" height="96" rx="10"/>
  <text class="tx-l" x="212" y="242">디스크 · 데이터 파일 (PostgreSQL 8KB, InnoDB 16KB짜리 페이지들)</text>
  <g>
    <rect class="bx" x="220" y="256" width="44" height="40" rx="4"/>
    <rect class="bx" x="268" y="256" width="44" height="40" rx="4"/>
    <rect class="bx" x="316" y="256" width="44" height="40" rx="4"/>
    <rect class="bx" x="364" y="256" width="44" height="40" rx="4"/>
    <rect class="bx" x="412" y="256" width="44" height="40" rx="4"/>
    <rect class="bx" x="460" y="256" width="44" height="40" rx="4"/>
    <rect class="bx" x="508" y="256" width="44" height="40" rx="4"/>
    <rect class="bx" x="556" y="256" width="44" height="40" rx="4"/>
    <rect class="bx" x="604" y="256" width="44" height="40" rx="4"/>
    <rect class="bx" x="652" y="256" width="44" height="40" rx="4"/>
  </g>
  <g class="tx-s tx-m" text-anchor="middle">
    <text x="242" y="280">0</text><text x="290" y="280">1</text><text x="338" y="280">2</text><text x="386" y="280">3</text><text x="434" y="280">4</text>
    <text x="482" y="280">5</text><text x="530" y="280">6</text><text x="578" y="280">7</text><text x="626" y="280">8</text><text x="674" y="280">9</text>
  </g>

  <!-- 없으면 디스크에서 읽어 옴 -->
  <line class="ln-ink" x1="482" y1="254" x2="646" y2="120" marker-end="url(#k)"/>
  <text class="tx-s" x="590" y="182">없으면 디스크에서</text>
  <text class="tx-s" x="590" y="198">페이지째 읽어 옴</text>

  <!-- 고친 페이지는 나중에 -->
  <line class="ln ln-dash" x1="488" y1="118" x2="342" y2="252" marker-end="url(#a)"/>
  <text class="tx-s" x="212" y="182">고친 페이지는 나중에</text>
  <text class="tx-s" x="212" y="198">모아서 디스크에 씀</text>
</svg>
