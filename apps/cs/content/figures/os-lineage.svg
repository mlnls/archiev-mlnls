<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 384">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path class="ah" d="M0 1 L9 5 L0 9 z"/>
    </marker>
  </defs>

  <!-- 유닉스 → BSD → macOS -->
  <g text-anchor="middle">
    <rect class="bx-line" x="0" y="10" width="110" height="44" rx="8"/>
    <text class="tx-b" x="55" y="29">유닉스</text>
    <text class="tx-s" x="55" y="46">1969 벨 연구소</text>
    <rect class="bx" x="150" y="10" width="100" height="44" rx="8"/>
    <text x="200" y="29">BSD</text>
    <text class="tx-s" x="200" y="46">버클리</text>
    <rect class="bx" x="290" y="10" width="110" height="44" rx="8"/>
    <text x="345" y="29">NeXTSTEP</text>
    <text class="tx-s" x="345" y="46">1989</text>
    <rect class="bx" x="440" y="10" width="110" height="44" rx="8"/>
    <text x="495" y="29">Mac OS X</text>
    <text class="tx-s" x="495" y="46">2001</text>
    <rect class="bx" x="590" y="10" width="130" height="44" rx="8"/>
    <text class="tx-b" x="655" y="29">macOS, iOS</text>
    <text class="tx-s" x="655" y="46">XNU 커널</text>
    <rect class="bx" x="290" y="70" width="110" height="34" rx="8"/>
    <text x="345" y="92">FreeBSD</text>
  </g>
  <g class="ln">
    <line x1="110" y1="32" x2="148" y2="32" marker-end="url(#a)"/>
    <line x1="250" y1="32" x2="288" y2="32" marker-end="url(#a)"/>
    <line x1="400" y1="32" x2="438" y2="32" marker-end="url(#a)"/>
    <line x1="550" y1="32" x2="588" y2="32" marker-end="url(#a)"/>
    <polyline points="200,54 200,87 288,87" marker-end="url(#a)"/>
  </g>
  <text class="tx-s" x="410" y="92">서버, PlayStation</text>

  <!-- 유닉스를 흉내 낸 Linux -->
  <polyline class="ln ln-dash" points="55,54 55,166 148,166" marker-end="url(#a)"/>
  <text class="tx-s" x="64" y="150">흉내 낸 새 구현</text>
  <g text-anchor="middle">
    <rect class="bx" x="150" y="144" width="140" height="44" rx="8"/>
    <text class="tx-b" x="220" y="163">Linux 커널</text>
    <text class="tx-s" x="220" y="180">1991 + GNU 도구</text>
  </g>
  <g class="ln">
    <polyline points="290,166 320,166"/>
    <line x1="320" y1="134" x2="320" y2="236"/>
    <line x1="320" y1="134" x2="348" y2="134" marker-end="url(#a)"/>
    <line x1="320" y1="168" x2="348" y2="168" marker-end="url(#a)"/>
    <line x1="320" y1="202" x2="348" y2="202" marker-end="url(#a)"/>
    <line x1="320" y1="236" x2="348" y2="236" marker-end="url(#a)"/>
  </g>
  <g>
    <rect class="bx" x="350" y="121" width="230" height="26" rx="6"/>
    <text x="362" y="139">Debian → Ubuntu</text>
    <rect class="bx" x="350" y="155" width="230" height="26" rx="6"/>
    <text x="362" y="173">Red Hat → Fedora, RHEL</text>
    <rect class="bx" x="350" y="189" width="230" height="26" rx="6"/>
    <text x="362" y="207">Alpine</text>
    <rect class="bx" x="350" y="223" width="230" height="26" rx="6"/>
    <text x="362" y="241">Android</text>
  </g>
  <g class="tx-s">
    <text x="590" y="173">Amazon Linux도</text>
    <text x="590" y="207">Docker 이미지</text>
  </g>

  <!-- Windows -->
  <line class="ln-faint" x1="0" y1="272" x2="720" y2="272"/>
  <g text-anchor="middle">
    <rect class="bx" x="0" y="286" width="110" height="40" rx="8"/>
    <text x="55" y="303">MS-DOS</text>
    <text class="tx-s" x="55" y="319">1981</text>
    <rect class="bx-dash" x="150" y="286" width="140" height="40" rx="8"/>
    <text x="220" y="303">Windows 95/98</text>
    <text class="tx-s" x="220" y="319">끝남</text>
    <rect class="bx" x="0" y="338" width="110" height="40" rx="8"/>
    <text x="55" y="355">Windows NT</text>
    <text class="tx-s" x="55" y="371">1993</text>
  </g>
  <rect class="bx" x="150" y="338" width="430" height="40" rx="8"/>
  <text class="tx-b" x="162" y="363">2000 → XP → 7 → 10 → 11, Windows Server</text>
  <text class="tx-s" x="590" y="355">VMS를 만든</text>
  <text class="tx-s" x="590" y="371">데이브 커틀러 팀</text>
  <g class="ln">
    <line x1="110" y1="306" x2="148" y2="306" marker-end="url(#a)"/>
    <line x1="110" y1="358" x2="148" y2="358" marker-end="url(#a)"/>
  </g>
</svg>
