<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 250">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path class="ah" d="M0 1 L9 5 L0 9 z"/>
    </marker>
  </defs>

  <text class="tx-b" x="20" y="38">users</text>
  <text class="tx-b" x="390" y="38">posts</text>

  <!-- users -->
  <g>
    <rect class="bx-ink" x="20" y="50" width="40" height="30"/>
    <rect class="bx-soft" x="60" y="50" width="70" height="30"/>
    <rect class="bx-soft" x="130" y="50" width="100" height="30"/>
    <rect class="bx" x="20" y="80" width="40" height="30"/><rect class="bx" x="60" y="80" width="70" height="30"/><rect class="bx" x="130" y="80" width="100" height="30"/>
    <rect class="bx" x="20" y="110" width="40" height="30"/><rect class="bx" x="60" y="110" width="70" height="30"/><rect class="bx" x="130" y="110" width="100" height="30"/>
  </g>
  <g text-anchor="middle">
    <text class="tx-inv" x="40" y="69">id</text>
    <text class="tx-b" x="95" y="69">name</text>
    <text class="tx-b" x="180" y="69">email</text>
    <text x="40" y="99">1</text><text x="95" y="99">민수</text><text class="tx-s tx-m" x="180" y="99">a@ex.com</text>
    <text x="40" y="129">2</text><text x="95" y="129">지은</text><text class="tx-s tx-m" x="180" y="129">b@ex.com</text>
  </g>

  <!-- posts -->
  <g>
    <rect class="bx-soft" x="390" y="50" width="40" height="30"/>
    <rect class="bx-ink" x="430" y="50" width="70" height="30"/>
    <rect class="bx-soft" x="500" y="50" width="90" height="30"/>
    <rect class="bx-soft" x="590" y="50" width="110" height="30"/>
    <rect class="bx" x="390" y="80" width="40" height="30"/><rect class="bx" x="430" y="80" width="70" height="30"/><rect class="bx" x="500" y="80" width="90" height="30"/><rect class="bx" x="590" y="80" width="110" height="30"/>
    <rect class="bx" x="390" y="110" width="40" height="30"/><rect class="bx" x="430" y="110" width="70" height="30"/><rect class="bx" x="500" y="110" width="90" height="30"/><rect class="bx" x="590" y="110" width="110" height="30"/>
    <rect class="bx" x="390" y="140" width="40" height="30"/><rect class="bx" x="430" y="140" width="70" height="30"/><rect class="bx" x="500" y="140" width="90" height="30"/><rect class="bx" x="590" y="140" width="110" height="30"/>
  </g>
  <g text-anchor="middle">
    <text class="tx-b" x="410" y="69">id</text>
    <text class="tx-inv" x="465" y="69">user_id</text>
    <text class="tx-b" x="545" y="69">title</text>
    <text class="tx-b" x="645" y="69">created_at</text>
    <text x="410" y="99">10</text><text class="tx-b" x="465" y="99">1</text><text x="545" y="99">첫 글</text><text class="tx-s tx-m" x="645" y="99">2026-11-01</text>
    <text x="410" y="129">11</text><text class="tx-b" x="465" y="129">1</text><text x="545" y="129">둘째 글</text><text class="tx-s tx-m" x="645" y="129">2026-11-03</text>
    <text x="410" y="159">12</text><text class="tx-b" x="465" y="159">2</text><text x="545" y="159">안녕</text><text class="tx-s tx-m" x="645" y="159">2026-11-05</text>
  </g>

  <!-- 글마다 user_id가 가리키는 사용자 -->
  <g class="ln">
    <line x1="388" y1="95" x2="234" y2="95" marker-end="url(#a)"/>
    <line x1="388" y1="125" x2="234" y2="97" marker-end="url(#a)"/>
    <line x1="388" y1="155" x2="234" y2="126" marker-end="url(#a)"/>
  </g>
  <text class="tx-s" x="311" y="178" text-anchor="middle">user_id가 가리키는 행</text>

  <!-- 키 이름표 -->
  <g class="tx-l" text-anchor="middle">
    <text x="40" y="160">기본 키</text>
    <text x="410" y="190">기본 키</text>
    <text x="465" y="190">외래 키</text>
  </g>
  <text class="tx-s" x="20" y="226">posts.user_id는 users.id를 가리킵니다. 글 하나는 사용자 하나에, 사용자 하나는 글 여러 개에 이어집니다(일대다).</text>
  <text class="tx-s" x="20" y="244">users에 없는 id(예: 3)를 user_id에 넣으려 하면 데이터베이스가 거절합니다.</text>
</svg>
