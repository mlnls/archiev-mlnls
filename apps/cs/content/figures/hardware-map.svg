<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 312">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path class="ah-ink" d="M0 1 L9 5 L0 9 z"/>
    </marker>
    <marker id="m" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path class="ah" d="M0 1 L9 5 L0 9 z"/>
    </marker>
  </defs>

  <!-- 네트워크 카드 → RAM: 이 페이지가 들어온 길 -->
  <path class="ln-ink" d="M110 52 V20 H610 V48" marker-end="url(#a)"/>
  <text class="tx-s" x="360" y="14" text-anchor="middle">이 페이지가 들어온 길: 네트워크 카드가 버스를 타고 RAM에 바로 씀 (DMA)</text>

  <rect class="bx" x="20" y="52" width="160" height="72" rx="8"/>
  <text class="tx-b" x="36" y="78">네트워크 카드</text>
  <text class="tx-s" x="36" y="98">Wi-Fi 칩, 랜 포트</text>
  <text class="tx-s" x="36" y="114">바깥에서 바이트가 들어옴</text>

  <!-- CPU -->
  <rect class="bx" x="220" y="52" width="230" height="140" rx="8"/>
  <text class="tx-b" x="236" y="76">CPU</text>
  <text class="tx-s" x="272" y="76">브라우저의 명령어를 실행</text>
  <rect class="bx-soft" x="236" y="88" width="94" height="52" rx="6"/>
  <text x="283" y="110" text-anchor="middle">코어</text>
  <text class="tx-s" x="283" y="128" text-anchor="middle">레지스터·L1·L2</text>
  <rect class="bx-soft" x="340" y="88" width="94" height="52" rx="6"/>
  <text x="387" y="110" text-anchor="middle">코어</text>
  <text class="tx-s" x="387" y="128" text-anchor="middle">레지스터·L1·L2</text>
  <rect class="bx-soft" x="236" y="148" width="198" height="30" rx="6"/>
  <text x="335" y="168" text-anchor="middle">L3 캐시 (코어들이 함께 씀)</text>

  <!-- RAM -->
  <rect class="bx" x="510" y="52" width="200" height="140" rx="8"/>
  <text class="tx-b" x="526" y="76">RAM</text>
  <text class="tx-s" x="570" y="76">전원이 꺼지면 지워짐</text>
  <rect class="bx-soft" x="526" y="88" width="168" height="30" rx="5"/>
  <text x="610" y="108" text-anchor="middle">브라우저 프로그램</text>
  <rect class="bx-ink" x="526" y="124" width="168" height="30" rx="5"/>
  <text class="tx-inv" x="610" y="144" text-anchor="middle">이 페이지 (4만 바이트)</text>
  <rect class="bx-soft" x="526" y="160" width="168" height="22" rx="5"/>
  <text class="tx-s" x="610" y="175" text-anchor="middle">다른 프로그램들</text>

  <!-- CPU ↔ RAM -->
  <line class="ln-ink" x1="450" y1="120" x2="510" y2="120"/>
  <text class="tx-s" x="480" y="112" text-anchor="middle">메모리 버스</text>

  <!-- GPU, 화면 -->
  <rect class="bx" x="220" y="232" width="230" height="64" rx="8"/>
  <text class="tx-b" x="236" y="258">GPU</text>
  <text class="tx-s" x="236" y="280">이 글자와 색을 픽셀로 칠함</text>
  <line class="ln" x1="335" y1="192" x2="335" y2="232"/>
  <rect class="bx" x="20" y="232" width="160" height="64" rx="8"/>
  <text class="tx-b" x="36" y="258">화면</text>
  <text class="tx-s" x="36" y="280">지금 보이는 픽셀</text>
  <line class="ln" x1="220" y1="264" x2="184" y2="264" marker-end="url(#m)"/>

  <!-- SSD -->
  <rect class="bx" x="510" y="232" width="200" height="64" rx="8"/>
  <text class="tx-b" x="526" y="258">SSD</text>
  <text class="tx-s" x="526" y="280">브라우저 원본, 체크 기록</text>
  <path class="ln" d="M450 176 H480 V264 H510"/>
  <text class="tx-s" x="486" y="222">PCIe</text>
</svg>
