  <g class="tx-m"><text class="tx-inv" x="12" y="63">api</text><text x="12" y="99">blog</text><text x="12" y="135">cs</text><text x="12" y="171">cv, employ, …</text></g>
  <g class="bx"><rect x="170" y="44" width="110" height="28" rx="5"/><rect x="170" y="80" width="110" height="28" rx="5"/><rect x="170" y="116" width="110" height="28" rx="5"/></g>
  <g class="tx-m"><text x="182" y="63">db</text><text x="182" y="99">core</text><text x="182" y="135">scraper</text></g>
  <g class="ln"><line x1="120" y1="58" x2="166" y2="58" marker-end="url(#m)"/><line x1="120" y1="62" x2="166" y2="92" marker-end="url(#m)"/><line x1="120" y1="66" x2="166" y2="126" marker-end="url(#m)"/></g>
  <g class="tx-s"><text x="0" y="206">blog는 api를 HTTP로만 부르고,</text><text x="0" y="222">api만 공통 패키지 셋에 기댑니다</text></g>

  <line class="ln-faint" x1="310" y1="0" x2="310" y2="262"/>
  <text class="tx-b" x="330" y="16">apps/api 안</text>
  <rect class="bx" x="330" y="26" width="390" height="76" rx="8"/>
  <text class="tx-l" x="342" y="44">src/app.ts · 라우트</text>
  <g class="tx-m"><text x="342" y="64">loginLimit.allow(ip)</text><text x="342" y="82">commentLimit.allow(ip)  × 2</text><text x="560" y="64">listComments(db, id)</text><text x="560" y="82">addComment(db, …)</text></g>
  <line class="ln-ink" x1="430" y1="102" x2="430" y2="128" marker-end="url(#a)"/>
  <line class="ln-ink" x1="630" y1="102" x2="630" y2="128" marker-end="url(#a)"/>
  <rect class="bx-ink" x="330" y="132" width="185" height="70" rx="8"/>
  <text class="tx-inv" x="342" y="152" font-weight="700">security.ts</text>
