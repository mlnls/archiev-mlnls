    <rect class="bx" x="448" y="26" width="192" height="34" rx="6"/>
    <text class="tx-m" x="544" y="47" text-anchor="middle">ef92b778…</text>
  </g>
  <g>
    <text class="tx-b" x="0" y="94">준호</text>
    <rect class="bx" x="44" y="72" width="126" height="34" rx="6"/>
    <text class="tx-m" x="107" y="93" text-anchor="middle">password123</text>
    <text x="181" y="94" text-anchor="middle">+</text>
    <rect class="bx-dash" x="192" y="72" width="110" height="34" rx="6"/>
    <text class="tx-s" x="247" y="93" text-anchor="middle">솔트 없음</text>
    <line class="ln" x1="302" y1="89" x2="328" y2="89" marker-end="url(#a)"/>
    <rect class="bx" x="330" y="72" width="90" height="34" rx="6"/>
    <text x="375" y="94" text-anchor="middle">SHA-256</text>
    <line class="ln" x1="420" y1="89" x2="446" y2="89" marker-end="url(#a)"/>
    <rect class="bx" x="448" y="72" width="192" height="34" rx="6"/>
    <text class="tx-m" x="544" y="93" text-anchor="middle">ef92b778…</text>
  </g>
  <path class="ln" d="M648 43 H660 V89 H648"/>
  <text class="tx-b" x="668" y="71">똑같음</text>
  <text class="tx-s" x="0" y="132">미리 계산해 둔 표에서 ef92b778… 하나만 찾으면 두 사람의 비밀번호가 한꺼번에 풀립니다</text>

  <line class="ln-faint" x1="0" y1="152" x2="720" y2="152"/>

  <!-- 아래: 사용자마다 솔트 + 느린 해시 -->
  <text class="tx-l" x="0" y="178">사용자마다 다른 솔트 + 일부러 느린 해시</text>
  <g>
    <text class="tx-b" x="0" y="212">민지</text>
    <rect class="bx" x="44" y="190" width="126" height="34" rx="6"/>
    <text class="tx-m" x="107" y="211" text-anchor="middle">password123</text>
    <text x="181" y="212" text-anchor="middle">+</text>
    <rect class="bx" x="192" y="190" width="110" height="34" rx="6"/>
