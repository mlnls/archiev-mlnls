<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 310">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path class="ah" d="M0 1 L9 5 L0 9 z"/>
    </marker>
  </defs>
  <!-- 위: 솔트 없이 빠른 해시 -->
  <text class="tx-l" x="0" y="14">솔트 없이 빠른 해시</text>
  <g>
    <text class="tx-b" x="0" y="48">민지</text>
    <rect class="bx" x="44" y="26" width="126" height="34" rx="6"/>
    <text class="tx-m" x="107" y="47" text-anchor="middle">password123</text>
    <text x="181" y="48" text-anchor="middle">+</text>
    <rect class="bx-dash" x="192" y="26" width="110" height="34" rx="6"/>
