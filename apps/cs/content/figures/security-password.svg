    <rect class="bx" x="448" y="190" width="192" height="34" rx="6"/>
    <text class="tx-m" x="544" y="211" text-anchor="middle">scrypt$3c9a…$74e5…</text>
  </g>
  <g>
    <text class="tx-b" x="0" y="258">준호</text>
    <rect class="bx" x="44" y="236" width="126" height="34" rx="6"/>
    <text class="tx-m" x="107" y="257" text-anchor="middle">password123</text>
    <text x="181" y="258" text-anchor="middle">+</text>
    <rect class="bx" x="192" y="236" width="110" height="34" rx="6"/>
    <text class="tx-m" x="247" y="257" text-anchor="middle">b7e204d1</text>
    <line class="ln" x1="302" y1="253" x2="328" y2="253" marker-end="url(#a)"/>
    <rect class="bx-ink" x="330" y="236" width="90" height="34" rx="6"/>
    <text class="tx-inv" x="375" y="258" text-anchor="middle" font-weight="700">scrypt</text>
    <line class="ln" x1="420" y1="253" x2="446" y2="253" marker-end="url(#a)"/>
    <rect class="bx" x="448" y="236" width="192" height="34" rx="6"/>
    <text class="tx-m" x="544" y="257" text-anchor="middle">scrypt$b7e2…$b7c8…</text>
