  <path class="ln" d="M648 207 H660 V253 H648"/>
  <text class="tx-b" x="668" y="235">다름</text>
  <text class="tx-s" x="0" y="296">솔트는 결과 앞에 함께 저장합니다. 비밀이 아니어도, 공격자는 후보마다 사람별로 느린 해시를 다시 돌려야 합니다</text>
